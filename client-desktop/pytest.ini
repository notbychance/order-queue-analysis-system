[pytest]
testpaths = tests
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: unit-тесты desktop-клиента
    data: тесты слоя локального хранения данных
    api: тесты HTTP-клиента FastAPI
    ui: тесты PySide6/QML-интерфейса
    integration: интеграционные тесты desktop-клиента
