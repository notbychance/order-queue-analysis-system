server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI backend proxy inside docker-compose network.
    # Browser requests /api/v1/... on the same origin as the web app,
    # nginx forwards them to http://server:8000/api/v1/...
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional server health proxy for quick checks from browser/container.
    location /health {
        proxy_pass http://server:8000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
