services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: queue-analysis-server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
