name: order-queue-analysis-system

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    container_name: queue-analysis-server
    environment:
      APP_NAME: ${SERVER_APP_NAME:-Queue Analysis API}
      APP_ENV: ${SERVER_APP_ENV:-development}
      DEBUG: ${SERVER_DEBUG:-false}
      API_PREFIX: ${SERVER_API_PREFIX:-/api/v1}
      CORS_ORIGINS: ${SERVER_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      CORS_ALLOW_CREDENTIALS: ${SERVER_CORS_ALLOW_CREDENTIALS:-false}
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - queue-analysis-network
    restart: unless-stopped

  client-web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:-/api/v1}
        VITE_REQUEST_TIMEOUT_MS: ${WEB_REQUEST_TIMEOUT_MS:-10000}
        VITE_APP_NAME: ${WEB_APP_NAME:-Queue Analysis Web}
    container_name: queue-analysis-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - queue-analysis-network
    restart: unless-stopped

  server-tests:
    profiles:
      - test
    build:
      context: ./server
      dockerfile: Dockerfile
      target: test
    container_name: queue-analysis-server-tests
    command: ["pytest"]
    environment:
      APP_NAME: Queue Analysis API
      APP_ENV: development
      DEBUG: "false"
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOW_CREDENTIALS: "false"
      LOG_LEVEL: INFO
    networks:
      - queue-analysis-network

  client-web-tests:
    profiles:
      - test
    build:
      context: ./client-web
      dockerfile: Dockerfile
      target: build
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_REQUEST_TIMEOUT_MS: 10000
        VITE_APP_NAME: Queue Analysis Web
    container_name: queue-analysis-web-tests
    command: ["npm", "run", "test:unit", "--", "--run"]
    networks:
      - queue-analysis-network

  client-desktop-tests:
    profiles:
      - test
    build:
      context: ./client-desktop
      dockerfile: Dockerfile
    container_name: queue-analysis-desktop-tests
    command: ["pytest"]
    environment:
      QT_QPA_PLATFORM: offscreen
    networks:
      - queue-analysis-network

networks:
  queue-analysis-network:
    driver: bridge
