name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_NAME: Queue Analysis API
          APP_ENV: development
          DEBUG: "false"
          API_PREFIX: /api/v1
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
          CORS_ALLOW_CREDENTIALS: "false"
          LOG_LEVEL: INFO
        run: pytest

  web-build:
    name: Web tests and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit -- --run

      - name: Run type-check
        run: npm run type-check

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_REQUEST_TIMEOUT_MS: "10000"
          VITE_APP_NAME: Queue Analysis Web
        run: npm run build

      - name: Pack web dist
        shell: bash
        run: |
          cd dist
          zip -r ../queue-analysis-web-dist.zip .

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: queue-analysis-web-dist
          path: client-web/queue-analysis-web-dist.zip
          if-no-files-found: error

  desktop-tests:
    name: Desktop tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-desktop

    env:
      QT_QPA_PLATFORM: offscreen
      APP_NAME: Queue Analysis Desktop
      APP_ENV: development
      LOG_LEVEL: INFO
      API_BASE_URL: http://localhost:8000/api/v1
      REQUEST_TIMEOUT_SECONDS: "10"
      HISTORY_STORAGE_TYPE: sqlite
      MAX_HISTORY_ITEMS: "50"
      HISTORY_JSON_PATH: ./data/history.json
      SQLITE_DATABASE_PATH: ./data/history.sqlite3
      SQLITE_CONNECTION_TIMEOUT_SECONDS: "5"
      SQLITE_ECHO_SQL: "false"
      THEME: system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt/PySide6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libglib2.0-0 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client-desktop/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  desktop-windows-build:
    name: Desktop Windows EXE build
    runs-on: windows-latest
    needs:
      - desktop-tests

    defaults:
      run:
        working-directory: client-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client-desktop/requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean QueueAnalysisDesktop.spec

      - name: Pack EXE folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\QueueAnalysisDesktop\*" `
            -DestinationPath "QueueAnalysisDesktop-windows.zip" `
            -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueueAnalysisDesktop-windows
          path: client-desktop/QueueAnalysisDesktop-windows.zip
          if-no-files-found: error

  docker-validation:
    name: Docker compose validation
    runs-on: ubuntu-latest
    needs:
      - server-tests
      - web-build
      - desktop-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: docker compose config

      - name: Build runtime containers
        run: docker compose build server client-web

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - server-tests
      - web-build
      - desktop-windows-build
      - docker-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release variables
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release notes file
        shell: bash
        run: |
          test -f docs/RELEASE_NOTES.md
          test -s docs/RELEASE_NOTES.md

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: queue-analysis-web-dist
          path: release-artifacts

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: QueueAnalysisDesktop-windows
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        shell: bash
        run: |
          PRERELEASE_FLAG=""

          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG_NAME" \
            release-artifacts/queue-analysis-web-dist.zip \
            release-artifacts/QueueAnalysisDesktop-windows.zip \
            --title "Release $TAG_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG
