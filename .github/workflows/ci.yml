name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_NAME: Queue Analysis API
          APP_ENV: development
          DEBUG: "false"
          API_PREFIX: /api/v1
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
          CORS_ALLOW_CREDENTIALS: "false"
          LOG_LEVEL: INFO
        run: pytest

  client-web:
    name: Web tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm run test:unit -- --run

      - name: Run type-check
        run: npm run type-check

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_REQUEST_TIMEOUT_MS: "10000"
          VITE_APP_NAME: Queue Analysis Web
        run: npm run build

  client-desktop:
    name: Desktop tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-desktop

    env:
      QT_QPA_PLATFORM: offscreen
      APP_NAME: Queue Analysis Desktop
      APP_ENV: development
      LOG_LEVEL: INFO
      API_BASE_URL: http://localhost:8000/api/v1
      REQUEST_TIMEOUT_SECONDS: "10"
      HISTORY_STORAGE_TYPE: sqlite
      MAX_HISTORY_ITEMS: "50"
      HISTORY_JSON_PATH: ./data/history.json
      SQLITE_DATABASE_PATH: ./data/history.sqlite3
      SQLITE_CONNECTION_TIMEOUT_SECONDS: "5"
      SQLITE_ECHO_SQL: "false"
      THEME: system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt/PySide6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libglib2.0-0 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: client-desktop/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    name: Docker compose validation
    runs-on: ubuntu-latest
    needs:
      - server
      - client-web
      - client-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: docker compose config

      - name: Build runtime containers
        run: docker compose build server client-web
