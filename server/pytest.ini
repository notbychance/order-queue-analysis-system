[pytest]
testpaths = tests
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: unit-тесты расчетной бизнес-логики
    api: тесты FastAPI endpoint-ов
    integration: интеграционные тесты серверной части